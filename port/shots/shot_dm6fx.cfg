// args: +set g_gametype 0 +set thereisnomonkey 1 +set cg_drawviewmodel 0 +devmap dm/mohdm6 +set fixedtime 10
// world effects on dm/mohdm6 (Stalingrad): the sun's lens flare (sun straight up, default "sun" flare), the blob shadow
// and stencil shadows (cg_shadows 2) of a spawned soldier, firing a Thompson at a wall (muzzle flash dlight, bullet
// marks, smoke, casings) and a grenade (explosion, debris swipes). Run with: port/shot.sh pair dm6fx shot_dm6fx.cfg
// Firing and the grenade are not deterministic run to run (the game's random effects differ even between two runs of
// one renderer), so their views are compared by eye; the others are deterministic.
// See shot_dm6.cfg for how the views are set up and why every view takes three captures.
set r_metalPresentStats 1
wait 6000
finishloadingscreen
wait 1000
noclip
// view 0, 1: the sun flare, looking up past the roofs
tele 0 0 400
face -80 90 0
wait 300
screenshot
wait 20
screenshot
wait 20
screenshot
face -55 90 0
wait 300
screenshot
wait 20
screenshot
wait 20
screenshot
// view 2: a soldier model (a script_model: no AI, stays put) in the stair hall with the blob shadow (cg_shadows 1, the
// default). spawn puts it 40 units ahead and 40 up, so spawning from 40 below the floor stands it on the floor.
tele -300 -768 8
face 0 0 0
wait 300
spawn script_model model models/human/allied_airborne_soldier.tik
tele -400 -768 120
face 20 0 0
wait 300
screenshot
wait 20
screenshot
wait 20
screenshot
// view 3: the same with stencil shadow volumes
set cg_shadows 2
wait 300
screenshot
wait 20
screenshot
wait 20
screenshot
set cg_shadows 1
// view 4, 5: fire the Thompson at the hall's wall: muzzle flash dlight while firing, then the bullet marks (by eye)
noclip
tele -408 -768 48
face 10 90 0
wuss
wait 500
use models/weapons/thompsonsmg.tik
wait 1000
+attack
wait 300
screenshot
wait 20
screenshot
wait 20
screenshot
-attack
wait 1000
screenshot
wait 20
screenshot
wait 20
screenshot
// view 6, 7: a frag grenade thrown at the floor ahead: the explosion ~4.5 s after the release (flash, dlight, sprites),
// then the smoke (by eye). The only retail tiki with a swipe trail (models/fx/fx_grenade_explosion.tik, whose debris
// would call the NULL re.SwipePoint) is referenced by no retail tiki, script or map, so swipes never run.
face 30 0 0
useweaponclass grenade
wait 1500
+attack
wait 500
-attack
wait 4400
screenshot
wait 20
screenshot
wait 20
screenshot
wait 500
screenshot
wait 20
screenshot
wait 20
screenshot
wait 300
quit
