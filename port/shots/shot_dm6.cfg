// args: +set g_gametype 0 +set thereisnomonkey 1 +set cg_drawviewmodel 0 +devmap dm/mohdm6 +set fixedtime 10
// fixed views of dm/mohdm6 (Stalingrad): sky, roofs, courtyard, the flickering indoor light, a spawned skinned model (spawn), the view model (wuss). Run with: port/shot.sh pair dm6 shot_dm6.cfg
// fixedtime 10: every frame advances game time by exactly 10 ms, so the frames are the same in every run (both renderers
// are bit-for-bit deterministic run to run). `wait N` then continues after N/10 - 1 frames: Cbuf_Execute subtracts the
// frame's msec right after the wait command, so `wait 10` doesn't wait and `wait 20` is exactly one frame.
// thereisnomonkey 1 unlocks the cheat commands (tele, face, noclip, spawn, wuss). Pitch < 0 looks up.
// Every view takes three captures, one frame apart: `screenshot` reads back before the frame is drawn, so Metal gets
// the previous frame, and GL1 on macOS whatever the back buffer holds after the swap: usually the frame from two
// frames back, sometimes one. `shot.sh views` compares Metal's middle capture with each GL1 capture and keeps the best.
