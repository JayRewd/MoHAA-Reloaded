// args: +set g_gametype 2 +set sv_maxclients 8 +set sv_maxbots 4 +set sv_numbots 0 +set fraglimit 0 +set timelimit 0 +map dm/mohdm6
// The message boxes beside the compass (session 68): a team game on dm/mohdm6, the player on the allies with a rifle,
// four bots joining (their "has joined" lines fill the game message box below the compass), three chat lines (the
// chat box right of the compass). One capture; run at several sizes, e.g.
//   port/shot.sh metal chat-720 shot_chat.cfg <the args above> +set r_customwidth 1280 +set r_customheight 720
// Not deterministic (bots, real time): for looking at the layout, not for pixel diffs.
wait 6000
join_team allies
wait 500
primarydmweapon rifle
wait 3000
set sv_numbots 4
wait 1500
say chat line one: the chat box starts right of the compass
say chat line two
say chat line three
wait 1500
screenshot
wait 100
quit
