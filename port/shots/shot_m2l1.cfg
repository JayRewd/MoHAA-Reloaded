wait 2000
tele -6628 -3864 528
face 0 20 0
wait 300
screenshot
wait 20
screenshot
wait 20
screenshot
tele -6628 -3864 528
face -20 200 0
wait 300
screenshot
wait 20
screenshot
wait 20
screenshot
wait 300
quit
