// args: +set g_gametype 0 +set thereisnomonkey 1 +set cg_drawviewmodel 0 +devmap dm/mohdm6 +set fixedtime 10
// texture filtering and the capability cvars, on dm6 view 0 (the courtyard floor at a grazing angle). Views:
// 0 default r_textureMode (gl_linear_mipmap_linear); 1 r_textureMode GL_NEAREST; 2 r_textureMode GL_LINEAR_MIPMAP_NEAREST; 3 r_textureMode GL_NEAREST_MIPMAP_LINEAR; 4 r_picmip 2; 5 anisotropy 16; 6 r_ext_multitexture 0; 7 r_ext_compressed_textures 1.
// Texture modes switch live; the latched cvars take a vid_restart. Run with: port/shot.sh pair tex shot_texmodes.cfg
wait 6000
finishloadingscreen
wait 1000
noclip
tele 0 0 400
face 15 0 0
wait 300
screenshot
wait 20
screenshot
wait 20
screenshot
r_textureMode GL_NEAREST
wait 300
screenshot
wait 20
screenshot
wait 20
screenshot
r_textureMode GL_LINEAR_MIPMAP_NEAREST
wait 300
screenshot
wait 20
screenshot
wait 20
screenshot
r_textureMode GL_NEAREST_MIPMAP_LINEAR
wait 300
screenshot
wait 20
screenshot
wait 20
screenshot
r_textureMode gl_linear_mipmap_linear
r_picmip 2
vid_restart
wait 1000
screenshot
wait 20
screenshot
wait 20
screenshot
r_picmip 0
r_ext_texture_filter_anisotropic 1
r_ext_max_anisotropy 16
vid_restart
wait 1000
screenshot
wait 20
screenshot
wait 20
screenshot
r_ext_texture_filter_anisotropic 0
r_ext_multitexture 0
vid_restart
wait 1000
screenshot
wait 20
screenshot
wait 20
screenshot
r_ext_multitexture 1
r_ext_compressed_textures 1
vid_restart
wait 1000
screenshot
wait 20
screenshot
wait 20
screenshot
r_ext_compressed_textures 0
wait 300
quit
