// args: +set g_gametype 0 +set thereisnomonkey 1 +set cg_drawviewmodel 0 +devmap dm/mohdm6 +set fixedtime 10
// every readback path, for both renderers: screenshotJPEG, a levelshot, a resampled screenshot, r_measureOverdraw
// (r_speeds 1 prints the overdraw ratio per frame), and a screenshot right before quit (Metal writes it at shutdown).
// Run with: port/shot.sh fixed <renderer> rb shot_readback.cfg; the jpg/levelshot land in home.noindex/main.
wait 6000
finishloadingscreen
wait 1000
noclip
tele 0 0 400
face 15 0 0
wait 300
screenshotJPEG rb_jpeg
wait 20
screenshot levelshot
wait 20
screenshot rb_small 320 240
wait 20
r_measureOverdraw 1
r_speeds 1
wait 100
r_speeds 0
r_measureOverdraw 0
wait 20
screenshot
quit
